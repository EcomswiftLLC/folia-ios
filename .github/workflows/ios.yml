name: iOS build, test and screenshots

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Unit tests
        run: |
          set -o pipefail
          mkdir -p build
          DEST=$(xcrun simctl list devices available | grep -E "iPhone 1[5-9]" | head -1 | sed -E 's/^ *(.*) \(([0-9A-F-]{36})\).*/\2/')
          echo "Simulator: $DEST"
          xcodebuild test -project Folia.xcodeproj -scheme Folia -destination "id=$DEST" -only-testing:FoliaTests CODE_SIGNING_ALLOWED=NO | tee build/test.log | grep -E "error:|warning: unre|Test Suite|Executed|BUILD|TEST " | tail -n 80
      - name: Compiler errors (if any)
        if: failure()
        run: grep -E "error:" build/test.log | sort -u | head -80 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs
          path: build/*.log
          if-no-files-found: ignore

