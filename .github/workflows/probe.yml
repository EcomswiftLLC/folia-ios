name: Probe Xcode versions
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: macos-26
    steps:
      - run: |
          ls -d /Applications/Xcode*.app
          for x in /Applications/Xcode*.app; do echo "$x"; /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$x/Contents/Info.plist"; done
          xcodebuild -showsdks | grep -i ios
