name: iOS build, test and screenshots

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Unit tests
        run: |
          set -o pipefail
          mkdir -p build
          DEST=$(xcrun simctl list devices available | grep -E "iPhone 1[5-9]" | head -1 | sed -E 's/^ *(.*) \(([0-9A-F-]{36})\).*/\2/')
          echo "Simulator: $DEST"
          xcodebuild test -project Folia.xcodeproj -scheme Folia -destination "id=$DEST" -only-testing:FoliaTests CODE_SIGNING_ALLOWED=NO | tee build/test.log | grep -E "error:|warning: unre|Test Suite|Executed|BUILD|TEST " | tail -n 80
      - name: Compiler errors (if any)
        if: failure()
        run: grep -E "error:" build/test.log | sort -u | head -80 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs
          path: build/*.log
          if-no-files-found: ignore

  screenshots:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "$XC"
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build for simulator
        run: |
          set -o pipefail
          mkdir -p build
          DEST=$(xcrun simctl list devices available | grep -E "iPhone 1[6-9] Pro Max" | head -1 | sed -E 's/^ *(.*) \(([0-9A-F-]{36})\).*/\2/')
          if [ -z "$DEST" ]; then DEST=$(xcrun simctl list devices available | grep -E "iPhone 1[5-9]" | head -1 | sed -E 's/^ *(.*) \(([0-9A-F-]{36})\).*/\2/'); fi
          echo "$DEST" > build/dest.txt
          xcodebuild build -project Folia.xcodeproj -scheme Folia -configuration Debug -destination "id=$DEST" -derivedDataPath build/dd CODE_SIGNING_ALLOWED=NO | tee build/shots-build.log | grep -E "error:|BUILD" | tail -n 40
      - name: Take screenshots
        run: |
          DEST=$(cat build/dest.txt)
          xcrun simctl boot "$DEST" || true
          xcrun simctl bootstatus "$DEST" -b || true
          xcrun simctl ui "$DEST" appearance dark || true
          APP=$(find build/dd -name Folia.app -maxdepth 6 | head -1)
          xcrun simctl install "$DEST" "$APP"
          mkdir -p shots
          CONTAINER=$(xcrun simctl get_app_container "$DEST" com.ecomswift.folia data)
          mkdir -p "$CONTAINER/Documents/samples"
          cp design/photos/*.jpg "$CONTAINER/Documents/samples/"
          cp design/masks/*.png "$CONTAINER/Documents/samples/"
          for SCREEN in home editor-adjust shot-home shot-filters shot-adjust shot-crop shot-text shot-cutout shot-collage shot-resize shot-compress shot-passport shot-watermark shot-metadata settings; do
            xcrun simctl terminate "$DEST" com.ecomswift.folia || true
            xcrun simctl launch "$DEST" com.ecomswift.folia -apScreen "$SCREEN" || true
            case "$SCREEN" in shot-cutout|shot-passport) WAIT=30 ;; *) WAIT=14 ;; esac
            sleep $WAIT
            xcrun simctl io "$DEST" screenshot "shots/$SCREEN.png" || true
          done
          ls shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs-shots
          path: build/*.log
          if-no-files-found: ignore
